<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050507">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Coverly</title>
<style>
:root{color-scheme:dark;--s:min(46vw,36vh,300px);--fg:#f2f2f7;--dim:#8e8e93;--acc:#0a84ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1,#2a2a30),var(--bg2,#000) 75%);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
header b{font-size:15px;letter-spacing:.5px;color:var(--dim)}
.add{background:#2c2c2e;color:var(--fg);border:0;border-radius:50%;width:38px;height:38px;padding:0;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add:hover{background:#3a3a3c}
#stage{flex:1;position:relative;perspective:1000px;min-height:0;touch-action:pan-y;cursor:grab}
.c{position:absolute;will-change:transform;left:50%;top:44%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:4px;background-size:cover;background-position:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;-webkit-box-reflect:below 2px linear-gradient(transparent 65%,rgba(255,255,255,.28));display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.4);color:rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(0,0,0,.6)}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);text-align:center;padding:24px}
#empty.hide{display:none}
#info{text-align:center;padding:4px 16px;min-height:52px}
#t{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#a{font-size:14px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;align-items:center;gap:10px;padding:6px 20px;max-width:640px;width:100%;margin:0 auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:28px;margin:0;background:none;cursor:pointer;outline:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p),#ffffff2e var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#ffffff2e}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.6);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.6)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3)}
input[type=range]:focus-visible{outline:2px solid var(--acc);outline-offset:-4px;border-radius:6px}
.bar span{min-width:38px;font-size:13px}#dur{text-align:right}
.ctl{display:flex;justify-content:center;align-items:center;gap:28px;padding:6px 0 18px}
.ctl button{background:none;border:0;outline:0;color:var(--fg);cursor:pointer;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .1s,background .15s}.ctl button:active{transform:scale(.92)}.ctl button:focus-visible{box-shadow:0 0 0 2px var(--acc)}.ctl svg{display:block}
.ctl button:hover{background:#ffffff14}
#pp{background:var(--fg);color:#000;width:68px;height:68px}
#pp:hover{background:#fff}
.volrow{display:flex;align-items:center;gap:6px;width:100%;max-width:240px;margin:0 auto;padding:0 20px 18px;box-sizing:content-box}
.volrow input{flex:1;min-width:0}
#rail{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:64px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow-y:auto;scrollbar-width:none;background:#0b0b0d;z-index:50;transform:translateX(-100%);transition:transform .25s ease}
#rail.open{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.6)}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#veil.show{opacity:1;pointer-events:auto}
#rail::-webkit-scrollbar{display:none}
.pl{position:relative;flex:none;width:44px;height:44px;border:0;padding:0;border-radius:50%;background-size:cover;background-position:center;background-color:#2c2c2e;color:#fff;font-size:18px;font-weight:600;cursor:pointer;transition:border-radius .2s,background-color .2s;display:flex;align-items:center;justify-content:center;outline:0;touch-action:pan-y}
.pl:hover,.pl.act{border-radius:14px}
.pl.act::before,.pl:hover::before{content:'';position:absolute;left:-10px;top:50%;width:4px;height:10px;margin-top:-5px;border-radius:0 3px 3px 0;background:#fff}
.pl.act::before{height:22px;margin-top:-11px}
.pl.plus{background:#1e1e20;color:#30d158;font-size:26px;font-weight:400}
.pl.plus:hover{background:#30d158;color:#fff}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
#dlg.show{display:flex}
#dlg .box{background:#1c1c1e;border-radius:14px;padding:16px;width:min(86vw,320px);display:flex;flex-direction:column;gap:12px}
#dn{background:#2c2c2e;border:0;border-radius:8px;color:var(--fg);padding:10px 12px;font-size:16px;outline:0}
#dlg .row{display:flex;gap:8px;justify-content:flex-end}
#dlg .row button{border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;background:#2c2c2e;color:var(--fg)}
#dok{background:var(--acc)!important}
#ddel{color:#ff453a!important;margin-right:auto}
#mute{background:none;border:0;outline:0;color:var(--dim);width:32px;height:32px;padding:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:color .15s}
#mute:hover{color:var(--fg)}
.hg{display:flex;gap:8px}.add svg{display:block}.add.on{background:var(--acc)}
@media(max-width:430px){header b{display:none}}
.pl.plus{order:999}
.pl.lift{transform:scale(1.15);box-shadow:0 6px 18px #000a;z-index:5;border-radius:14px}
.pnl{position:absolute;inset:0;z-index:200;display:none;overflow-y:auto;background:linear-gradient(#000c,#000e);scrollbar-width:thin;cursor:default}
.pnl.show{display:block}
#lyrics{text-align:center;padding:40vh 20px}
.ll{font-size:clamp(18px,4.6vw,26px);font-weight:700;color:#ffffff55;padding:8px 0;cursor:pointer;transition:color .25s,transform .25s}
.ll.on{color:#fff;transform:scale(1.06)}
.ll:hover{color:#ffffffaa}
.lyn{color:var(--dim);font-size:15px;padding:20px;margin-top:-30vh}
#tlist{display:flex;flex-direction:column;padding:10px 12px}
.tr{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:10px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 56px}
.tr:hover{background:#ffffff10}.tr.cur{background:#0a84ff30}
.tr.drag{background:#3a3a3c;box-shadow:0 4px 16px #000a;position:relative;z-index:2}
.tri{width:40px;height:40px;border-radius:6px;background-size:cover;background-position:center;flex:none}
.trt{flex:1;min-width:0}
.trt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.trt div+div{font-size:12px;color:var(--dim);margin-top:2px}
.trh{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--dim);touch-action:none;cursor:grab;flex:none}
/* боковое меню: «стеклянная» плавающая панель в стиле плеера */
#rail{left:10px;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:auto;width:68px;max-height:max(180px,calc(100% - 220px));padding:10px 0;gap:10px;border-radius:22px;background:rgba(30,30,34,.78);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.55);transform:translateX(-14px) scale(.96);transform-origin:top left;opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
#rail.open{transform:none;opacity:1;pointer-events:auto;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.pl{width:48px;height:48px;border-radius:14px;background-color:#ffffff14}
.pl:hover{border-radius:14px;filter:brightness(1.15)}
.pl.act{border-radius:14px;box-shadow:0 0 0 2px var(--acc)}
.pl.act::before,.pl:hover::before{display:none}
.pl.plus{background:transparent;border:1.5px dashed #ffffff40;color:var(--dim);font-size:24px}
.pl.plus:hover{background:#0a84ff26;border-color:var(--acc);color:var(--acc);filter:none}
#veil{background:rgba(0,0,0,.35)}
@property --acc{syntax:'<color>';inherits:true;initial-value:#0a84ff}
@property --bg1{syntax:'<color>';inherits:true;initial-value:#2a2a30}
:root{transition:--acc .8s,--bg1 .8s}
/* громкость слева, справа перемешивание и повтор */
.volrow{max-width:640px;box-sizing:border-box}
#vol{flex:none;width:min(46vw,170px)}
.sr{margin-left:auto;display:flex;gap:6px}
.mb{background:none;border:0;outline:0;color:var(--dim);width:32px;height:32px;padding:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;flex:none;transition:color .15s}
.mb:hover{color:var(--fg)}.mb.on{color:var(--acc)}
#rep.one::after{content:'1';position:absolute;right:5px;top:3px;font-size:9px;font-weight:700}
/* избранное */
#info{position:relative;padding:4px 56px}
.favb{position:absolute;right:14px;top:4px;width:36px;height:36px;border:0;background:none;border-radius:50%;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.favb svg{fill:none;display:block}.favb.on{color:#ff375f}.favb.on svg{fill:currentColor}
/* поиск по трекам, окно настроек */
#tsearch{position:sticky;top:0;z-index:3;display:block;width:calc(100% - 24px);margin:10px 12px 0;padding:10px 14px;border:0;border-radius:12px;background:#2c2c2e;color:var(--fg);font-size:15px;outline:0}
#tsearch,#dn{user-select:text;-webkit-user-select:text}
.pop{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);width:min(88vw,310px);padding:14px;border-radius:18px;background:rgba(30,30,34,.86);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid #ffffff14;box-shadow:0 14px 40px #000a;z-index:60;display:none;flex-direction:column;gap:6px}
.pop.show{display:flex}
.pop h4{margin:8px 0 2px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.4px}
.pop h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:14px;padding:6px 11px;background:#ffffff14;color:var(--fg);font-size:13px;cursor:pointer}
.chip.on{background:var(--acc)}
.pop small{color:var(--dim);font-size:11px}
.pop{max-height:calc(100% - 100px);overflow-y:auto}
.sw{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--bg2,#000),0 0 0 4px var(--fg)}
.sw.cust{position:relative;display:inline-block;overflow:hidden;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sw.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
#acc{align-items:center}
/* светлая тема */
:root[data-theme=light]{--fg:#1c1c1e;--dim:#6e6e73;--bg1:#ffffff;--bg2:#e6e6ec;color-scheme:light}
[data-theme=light] .add{background:#e3e3e8}
[data-theme=light] .add:hover{background:#d6d6dc}
[data-theme=light] .add.on{background:var(--acc);color:#fff}
[data-theme=light] .ctl button:hover{background:#00000010}
[data-theme=light] #pp{color:#fff}
[data-theme=light] #pp:hover{background:#3a3a3c}
[data-theme=light] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--fg) var(--p),#0000002a var(--p))}
[data-theme=light] input[type=range]::-moz-range-track{background:#0000002a}
[data-theme=light] #rail,[data-theme=light] .pop{background:rgba(255,255,255,.88);border-color:#00000014;box-shadow:0 14px 40px #00000030}
[data-theme=light] .pl{background-color:#00000012}
[data-theme=light] .pl.plus{border-color:#00000040}
[data-theme=light] #veil{background:rgba(0,0,0,.2)}
[data-theme=light] .chip{background:#00000010;color:var(--fg)}
[data-theme=light] .chip.on{background:var(--acc);color:#fff}
[data-theme=light] #dlg{background:rgba(0,0,0,.35)}
[data-theme=light] #dlg .box{background:#fff}
[data-theme=light] #dn,[data-theme=light] #tsearch{background:#ececf0;color:var(--fg)}
[data-theme=light] #dlg .row button{background:#ececf0;color:var(--fg)}
[data-theme=light] #dlg .row #dok{color:#fff}
[data-theme=light] .pnl{background:linear-gradient(#f4f4f8ee,#f4f4f8)}
[data-theme=light] .ll{color:#00000040}
[data-theme=light] .ll.on{color:var(--fg)}
[data-theme=light] .ll:hover{color:#00000099}
[data-theme=light] .tr:hover{background:#00000008}
[data-theme=light] .tr.drag{background:#e3e3e8}
[data-theme=light] .tr.cur{background:#0a84ff22}
[data-theme=light] .pl.plus:hover{background:#0a84ff26}
#stwrap{flex:1 1 0;position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
#stage{position:relative;inset:auto;flex:1 1 0;min-height:0}
.pnl{position:relative;inset:auto;flex:1 1 0;min-height:0;height:auto;z-index:auto;overscroll-behavior:contain}
#stwrap.pv #stage{display:none}
#stage{position:absolute;inset:0;flex:none}
.pnl{background:linear-gradient(#000e,#000f)}
/* выбор треков */
.chk{display:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);flex:none;align-items:center;justify-content:center;position:relative}
.selmode .chk{display:flex}.selmode .trh{display:none}
.tr.picked{background:#0a84ff26}.tr.picked .chk{background:var(--acc);border-color:var(--acc)}
.tr.picked .chk::after{content:'';width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
#selbar{position:sticky;bottom:0;display:none;align-items:center;gap:2px;padding:8px 12px;background:rgba(30,30,34,.96);border-top:1px solid #ffffff14;z-index:3}
.selmode #selbar{display:flex}
#selbar .sp{flex:1}#selN{font-size:14px;margin-right:6px;white-space:nowrap}
#selbar button{width:40px;height:40px;border:0;background:none;color:var(--fg);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#selbar button:hover{background:#ffffff14}#sDel.arm{color:#ff453a;background:#ff453a22}
#mvd{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
#mvd.show{display:flex}
#mvd .box{background:#1c1c1e;border-radius:14px;padding:16px;width:min(88vw,340px);display:flex;flex-direction:column;gap:10px}
#mvd h4{margin:0;font-size:15px}
#mvl{max-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.mvr{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#ffffff10;cursor:pointer}
.mvr:hover{background:#ffffff1c}
.mvt{width:34px;height:34px;border-radius:8px;background-size:cover;background-position:center;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.mvr span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mvd .row{display:flex;justify-content:flex-end}
#mvd .row button{border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;background:#2c2c2e;color:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:rgba(30,30,34,.94);color:#fff;padding:9px 16px;border-radius:18px;font-size:13px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
[data-theme=light] #selbar{background:rgba(255,255,255,.96);border-color:#00000014}
[data-theme=light] #selbar button:hover{background:#00000010}
[data-theme=light] #mvd .box{background:#fff}
[data-theme=light] .mvr{background:#00000008}[data-theme=light] .mvr:hover{background:#00000012}
[data-theme=light] #mvd .row button{background:#ececf0;color:var(--fg)}
[data-theme=light] .tr.picked{background:#0a84ff22}
#rail{visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s,visibility 0s linear .22s}
#rail.open{visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s,visibility 0s}
body{padding-bottom:var(--adh,0px)}
.c.miss{opacity:.45;filter:grayscale(1)}
.tr.miss{opacity:.55}
#pwa:empty{display:none}
</style>
</head>
<body>
<nav id="rail"></nav>
<div id="veil"></div>

const $=id=>document.getElementById(id);

const blobOf=new Map();
{const c=URL.createObjectURL.bind(URL),r=URL.revokeObjectURL.bind(URL);
 URL.createObjectURL=b=>{const u=c(b);blobOf.set(u,b);return u};
 URL.revokeObjectURL=u=>{blobOf.delete(u);r(u)}}
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

function dec(b,enc){
  try{
    let l=enc===1?(b[0]===0xFE?'utf-16be':'utf-16le'):enc===2?'utf-16be':enc===3?'utf-8':'windows-1252';
    return new TextDecoder(l).decode(b).replace(/\0+$/,'').trim();
  }catch(e){return ''}
}
const baseTags=f=>({title:f.name.replace(/\.[^.]+$/,''),artist:'',pic:null});
const picURL=(b,m)=>URL.createObjectURL(new Blob([b],{type:m||'image/jpeg'}));
async function readTags(file){
  const n=file.name.toLowerCase();
  if(n.endsWith('.flac'))return readFlac(file);
  if(n.endsWith('.m4a')||n.endsWith('.mp4'))return readMp4(file);
  {
    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(String.fromCharCode(head[0],head[1],head[2])!=='ID3')return baseTags(file);
    const size=((head[6]&127)<<21)|((head[7]&127)<<14)|((head[8]&127)<<7)|(head[9]&127);
    const buf=await file.slice(0,Math.min(size+10,16e6)).arrayBuffer();
    const f2={name:file.name,slice:()=>({arrayBuffer:()=>Promise.resolve(buf)})};
    const t=await readID3(f2);if(!t.pic)t.pic=await sniffPic(f2);return t;
  }
}
async function sniffPic(file){
  try{
    const u=new Uint8Array(await file.slice(0,4e6).arrayBuffer());
    if(String.fromCharCode(u[0],u[1],u[2])!=='ID3')return null;
    const end=Math.min(u.length,(((u[6]&127)<<21)|((u[7]&127)<<14)|((u[8]&127)<<7)|(u[9]&127))+10);
    for(let i=10;i<end-4;i++){
      if(u[i]===0xFF&&u[i+1]===0xD8&&u[i+2]===0xFF)return picURL(u.subarray(i,end),'image/jpeg');
      if(u[i]===0x89&&u[i+1]===0x50&&u[i+2]===0x4E&&u[i+3]===0x47)return picURL(u.subarray(i,end),'image/png');
    }
  }catch(e){}
  return null;
}
async function readFlac(file){
  const t=baseTags(file);
  try{
    const buf=await file.slice(0,8e6).arrayBuffer(),u=new Uint8Array(buf),v=new DataView(buf);
    if(String.fromCharCode(u[0],u[1],u[2],u[3])!=='fLaC')return t;
    let p=4,last=false;
    while(!last&&p+4<=buf.byteLength){
      last=!!(u[p]&128);const type=u[p]&127,len=(u[p+1]<<16)|(u[p+2]<<8)|u[p+3];p+=4;
      if(p+len>buf.byteLength)break;
      if(type===4){
        let q=p;q+=4+v.getUint32(q,true);const cnt=v.getUint32(q,true);q+=4;
        for(let i=0;i<cnt;i++){
          const l=v.getUint32(q,true);q+=4;const s=dec(u.subarray(q,q+l),3);q+=l;
          const k=s.indexOf('=');if(k<0)continue;
          const key=s.slice(0,k).toUpperCase(),val=s.slice(k+1);
          if(key==='TITLE'&&val)t.title=val;else if(key==='ARTIST'&&val)t.artist=val;
        }
      }else if(type===6&&!t.pic){
        let q=p+4;const ml=v.getUint32(q);q+=4;
        const mime=String.fromCharCode(...u.subarray(q,q+ml));q+=ml;
        const dl=v.getUint32(q);q+=4+dl+16;
        const pl=v.getUint32(q);q+=4;
        t.pic=picURL(u.subarray(q,q+pl),mime);
      }
      p+=len;
    }
  }catch(e){}
  return t;
}
async function readMp4(file){
  const t=baseTags(file);
  try{
    const buf=await file.slice(0,8e6).arrayBuffer(),u=new Uint8Array(buf),v=new DataView(buf);
    const tg=o=>String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]);
    const walk=(s,e)=>{
      let p=s;
      while(p+8<=e){
        let sz=v.getUint32(p),h=8;const name=tg(p+4);
        if(sz===1){sz=Number(v.getBigUint64(p+8));h=16}
        if(sz===0)sz=e-p;
        if(sz<h||p+sz>e)break;
        const b=p+h,end=p+sz;
        if(name==='moov'||name==='udta'||name==='ilst')walk(b,end);
        else if(name==='meta')walk(b+4,end);
        else if((name==='\u00a9nam'||name==='\u00a9ART'||name==='covr')&&tg(b+4)==='data'){
          const d=u.subarray(b+16,b+v.getUint32(b));
          if(name==='covr')t.pic=picURL(d,d[0]===0x89?'image/png':'image/jpeg');
          else if(name==='\u00a9nam')t.title=dec(d,3)||t.title;
          else t.artist=dec(d,3)||t.artist;
        }
        p=end;
      }
    };
    walk(0,buf.byteLength);
  }catch(e){}
  return t;
}
async function readID3(file){
  const t={title:file.name.replace(/\.[^.]+$/,''),artist:'',pic:null};
  try{
    const buf=await file.slice(0,4e6).arrayBuffer(),u=new Uint8Array(buf),v=new DataView(buf);
    if(String.fromCharCode(u[0],u[1],u[2])!=='ID3')return t;
    const ver=u[3],size=((u[6]&127)<<21)|((u[7]&127)<<14)|((u[8]&127)<<7)|(u[9]&127);
    let p=10;const end=Math.min(size+10,buf.byteLength-10);
    while(p<end){
      const id=String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const fs=ver===4?((u[p+4]&127)<<21)|((u[p+5]&127)<<14)|((u[p+6]&127)<<7)|(u[p+7]&127):v.getUint32(p+4);
      const b=p+10,e=b+fs;if(e>buf.byteLength)break;
      const enc=u[b];
      if(id==='TIT2'||id==='TPE1'){const s=dec(u.subarray(b+1,e),enc);if(s){if(id==='TIT2')t.title=s;else t.artist=s}}
      else if(id==='APIC'&&!t.pic){
        let q=b+1;while(q<e&&u[q])q++;
        const mime=String.fromCharCode(...u.subarray(b+1,q));q+=2;
        if(enc===1||enc===2){while(q<e-1&&!(u[q]===0&&u[q+1]===0))q++;q+=2}else{while(q<e&&u[q])q++;q++}
        if(q<e)t.pic=URL.createObjectURL(new Blob([u.subarray(q,e)],{type:mime.startsWith('image')?mime:'image/jpeg'}));
      }
      p=e;
    }
  }catch(e){}
  return t;
}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function thumb(url){
  const b=blobOf.get(url);
  if(b&&window.createImageBitmap)return createImageBitmap(b).then(bm=>{
    const k=Math.min(1,420/Math.max(bm.width,bm.height));
    if(k===1){if(bm.close)bm.close();return url}
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
    return new Promise(r=>c.toBlob(bl=>r(bl?URL.createObjectURL(bl):url),'image/jpeg',.85));
  }).catch(()=>thumbImg(url));
  return thumbImg(url);
}
function thumbImg(url){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.naturalWidth,im.naturalHeight));if(k===1){r(url);return}const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>r(b?URL.createObjectURL(b):url),'image/jpeg',.85)};im.onerror=()=>r(url);im.src=url})}
function setCover(t){
  const el=t.el;if(!el)return;
  if(t.pic){const src=t.pic;el.textContent='';thumb(src).then(u=>{if(t.pic===src)el.style.backgroundImage=`url("${u}")`})}
  else{const h=hue(t.title);el.style.backgroundImage=`linear-gradient(135deg,hsl(${h} 60% 45%),hsl(${(h+50)%360} 70% 22%))`;el.textContent='♪'}
}
let playlists=[],pi=-1;
const rail=$('rail');
function createPl(name){playlists.push({name:name||T('plName')+' '+(playlists.length+1),tracks:[],cur:0});switchPl(playlists.length-1)}
function switchPl(k){
  setRail(false);exitSel();queue.length=0;
  if(k===pi)return;

  pi=k;const pl=playlists[k];

  updateRail();
}
function removePl(k){
  const was=k===pi;
  {const rm=playlists[k];if(!rm.fav){const ids=new Set(rm.tracks.map(t=>t.id));delTracks([...ids]);const fv=playlists.find(p=>p.fav);if(fv)fv.tracks.splice(0,fv.tracks.length,...fv.tracks.filter(t=>!ids.has(t.id)))}}
  playlists.splice(k,1);
  if(!playlists.length){pi=-1;tracks=[];cur=0;pend=null;clearTimeout(selT);stage.querySelectorAll('.c').forEach(e=>e.remove());audio.pause();audio.removeAttribute('src');$('t').textContent='';$('a').textContent='';$('empty').classList.remove('hide');updateRail();if(view==='tl')renderList();if(view==='ly')renderLyrics();return}
  if(was){pi=-1;switchPl(Math.min(k,playlists.length-1))}
  else{if(k<pi)pi--;updateRail()}
}
let railQ=0;
function updateRail(){if(!railQ)railQ=setTimeout(()=>{railQ=0;updateRailNow()},50)}
function updateRailNow(){
  rail.textContent='';
  playlists.forEach((pl,k)=>{
    const b=document.createElement('button');b.className='pl'+(k===pi?' act':'');b.title=pl.fav?T('favName'):pl.name;

    else if(src)b.style.backgroundImage=`url("${src}")`;
    else{const h=hue(pl.name);b.style.backgroundImage=`linear-gradient(135deg,hsl(${h} 60% 45%),hsl(${(h+50)%360} 70% 22%))`;b.textContent=(pl.name[0]||'♪').toUpperCase()}
    b._pl=pl;
    b.onpointerdown=e=>railDown(e,b);
    b.onclick=()=>{if(rdSup){rdSup=false;return}switchPl(playlists.indexOf(pl))};

    const fb=document.createElement('button');fb.className='pl plus';fb.title=T('folderPl');
    fb.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';
    fb.onclick=()=>$('dirfile').click();rail.appendChild(fb);

$('plimg').onchange=async e=>{const f=e.target.files[0],p=playlists[editK];e.target.value='';if(f&&p){p.pic=await thumb(URL.createObjectURL(f));updateRail();$('dres').style.display=''}};
$('dlg').onclick=e=>{if(e.target===$('dlg'))closeDlg()};

function mkEl(t){
    const el=document.createElement('div');el.className='c';if(t.missing)el.classList.add('miss');
    t.el=el;el.style.display='none';t.vis=false;
    let timer=null,sx0=0,sy0=0,held=false;
    const cancel=()=>{clearTimeout(timer);el.style.filter=''};
    el.addEventListener('pointerdown',e=>{held=false;sx0=e.clientX;sy0=e.clientY;clearTimeout(timer);timer=setTimeout(()=>{held=true;el.style.filter='brightness(1.3)';if(navigator.vibrate)navigator.vibrate(25)},500)});
    el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx0,e.clientY-sy0)>10){cancel();held=false}});
    el.addEventListener('pointerup',()=>{cancel();if(held){artTarget=t;$('imgfile').click()}});
    el.addEventListener('pointercancel',cancel);el.addEventListener('pointerleave',cancel);
    el.addEventListener('contextmenu',e=>e.preventDefault());
    el.addEventListener('click',()=>{if(held){held=false;return}const ix=tracks.indexOf(t);if(ix===cur)toggle();else select(ix,true)});
  return el;
}
async function addFiles(list){

async function readText(f){const b=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1251').decode(b)}}
function parseLrc(txt){
  const out=[];
  for(const line of txt.split(/\r?\n/)){
    const m=[...line.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if(!m.length)continue;
    const s=line.replace(/\[[^\]]*\]/g,'').trim();
    for(const x of m)out.push({t:+x[1]*60+parseFloat(x[2].replace(':','.')),s});
  }
  return out.sort((a,b)=>a.t-b.t);
}
let lyData=null,lyEls=[],lyIdx=-1,lyTok=0;

  if(!any&&keys.length===1&&tracks[cur]){const t=tracks[cur];t.lrcFile=m[keys[0]];t.lrcP=null}
  if(view==='ly')renderLyrics();
}
async function renderLyrics(){

  if(!t){note(T('noTrack'));return}

  let lrc=await t.lrcP;

    if(!t.lrcText)note(T('findLyr'));

function syncLyrics(jump){

// ---- поиск обложек в интернете (iTunes Search) ----
const covQ=[],covCache=new Map();let covBusy=false;
function cleanQuery(t){
  let s=t.title.replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/^\d{1,3}[\s.\-_]+/,'').replace(/_+/g,' ');
  s=s.replace(/\s+-\s+(remaster(ed)?|official|lyrics?|live|single|radio|explicit).*$/i,'').replace(/\s+/g,' ').trim();
  return (s.includes(' - ')||!t.artist?s:t.artist+' '+s).trim();
}
async function lookupCover(t){
  const q=cleanQuery(t);if(q.length<3)return null;
  if(covCache.has(q))return covCache.get(q);
  const r=await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=5&term='+encodeURIComponent(q));
  if(!r.ok)return null;
  const j=await r.json();
  const words=q.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>=3);
  let url=null;
  if(words.length)for(const x of j.results||[]){
    const hay=((x.artistName||'')+' '+(x.trackName||'')).toLowerCase();
    const hit=words.filter(w=>hay.includes(w)).length;
    if(hit>=Math.max(1,Math.ceil(words.length*.6))&&x.artworkUrl100){url=x.artworkUrl100.replace(/\/\d+x\d+bb\./,'/400x400bb.');break}
  }
  covCache.set(q,url);return url;
}
function findCover(t,front){
  if(!onlineOn||!t||t.pic||t.coverTried)return;
  const i=covQ.indexOf(t);
  if(i>=0){if(front&&i>0){covQ.splice(i,1);covQ.unshift(t)}return}
  front?covQ.unshift(t):covQ.push(t);
  if(!covBusy)runCov();
}
async function runCov(){
  covBusy=true;
  while(covQ.length){
    const t=covQ.shift();
    if(t.pic||t.coverTried)continue;
    t.coverTried=true;
    try{
      const u=await lookupCover(t);
      if(u&&!t.pic){
        t.pic=u;saveMeta(t);if(t.el)setCover(t);if(tracks[cur]===t)applyTrackUI(t);
        if(tracks[cur]===t&&'mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:[{src:u}]});
        updateRail();
        const row=[...tlist.children].find(r=>r._t===t);if(row){const im=row.querySelector('.tri');if(im)im.style.backgroundImage=`url("${u}")`}
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,2500));
  }
  covBusy=false;
}

function ensureFav(){
  let f=playlists.find(p=>p.fav);
  if(!f){f={name:'Избранное',fav:true,tracks:[],cur:0};playlists.unshift(f);if(pi>=0)pi++;updateRail()}
  return f;
}
function toggleFav(){
  const t=tracks[cur];if(!t)return;
  t.fav=!t.fav;const f=ensureFav();
  if(t.fav){if(!f.tracks.includes(t))f.tracks.push(t)}
  else{
    const i=f.tracks.indexOf(t);
    if(i>=0){
      f.tracks.splice(i,1);
      if(f===playlists[pi]){f.cur=Math.min(cur,Math.max(0,f.tracks.length-1));const idx=pi;pi=-1;switchPl(idx)}
    }
  }
  $('fav').classList.toggle('on',!!t.fav);
  saveMeta(t);scheduleSave();updateRail();
}

let vizRGB=[10,132,255];
function coverColor(url){
  return new Promise(r=>{
    const im=new Image();if(/^https?:/.test(url))im.crossOrigin='anonymous';
    im.onload=()=>{
      try{
        const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);
        const d=x.getImageData(0,0,16,16).data;let R=0,G=0,B=0,W=0;
        for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),sat=mx?(mx-mn)/mx:0,w=.1+sat*sat*3+mx/255*.2;R+=d[i]*w;G+=d[i+1]*w;B+=d[i+2]*w;W+=w}
        r([R/W,G/W,B/W]);
      }catch(e){r(null)}
    };
    im.onerror=()=>r(null);im.src=url;
  });
}
function hsl2rgb(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)].map(x=>Math.round(x*255))}
function setThemeRaw(c){
  const root=document.documentElement.style;
  if(c){
    const R=c[0]/255,G=c[1]/255,B=c[2]/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn,l=(mx+mn)/2;
    const s0=d?d/(1-Math.abs(2*l-1)):0;
    if(s0>=.15){
      let h=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;h=(h*60+360)%360;
      const s=Math.min(1,Math.max(s0,.5));
      root.setProperty('--acc',`hsl(${Math.round(h)} ${Math.round(s*100)}% 58%)`);
      root.setProperty('--bg1',`hsl(${Math.round(h)} ${Math.round(Math.min(.6,s)*100)}% ${document.documentElement.dataset.theme==='light'?90:20}%)`);
      vizRGB=hsl2rgb(h,s,.58);return;
    }
  }
  root.removeProperty('--acc');root.removeProperty('--bg1');vizRGB=[10,132,255];
}
function setTheme(c){setThemeRaw(c);applyAccent()}
function applyAccent(){if(accent!=='auto')document.documentElement.style.setProperty('--acc',accent)}

// ================= тексты из интернета (LRCLIB) =================
async function findLyrics(t){
  if(t.lrcText)return t.lrcText;
  if(t.lyTried||!onlineOn)return null;
  let artist=t.artist||'',track=t.title.replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/^\d{1,3}[\s.\-_]+/,'').replace(/\s+/g,' ').trim();
  const m=track.match(/^(.+?)\s+-\s+(.+)$/);if(m){artist=m[1];track=m[2]}
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{
    const dur=tracks[cur]===t&&isFinite(audio.duration)?audio.duration:0;
    const r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent((artist+' '+track).trim()),{signal:ctl.signal});
    if(!r.ok)return null;
    const arr=await r.json();
    t.lyTried=true;
    const words=track.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>=3);
    let best=null,bd=1e9;
    for(const x of arr){
      if(!x.syncedLyrics)continue;
      const hay=((x.trackName||'')+' '+(x.artistName||'')).toLowerCase();
      if(words.length&&words.filter(w=>hay.includes(w)).length<Math.ceil(words.length*.6))continue;
      const d=dur&&x.duration?Math.abs(x.duration-dur):0;
      if(dur&&d>8)continue;
      if(d<bd){bd=d;best=x}
    }
    if(best){t.lrcText=best.syncedLyrics;saveMeta(t);return t.lrcText}
  }catch(e){}finally{clearTimeout(to)}
  return null;
}

function bgPlugin(){try{return NATIVE&&Capacitor.Plugins&&Capacitor.Plugins.Bg}catch(e){return null}}
let bgListening=false;
function bgListen(b){
  if(bgListening)return;bgListening=true;
  try{b.addListener('action',e=>{
    const a=e&&e.action;
    if(a==='toggle')toggle();
    else if(a==='play'){if(audio.paused)toggle()}
    else if(a==='pause'){if(!audio.paused)toggle()}
    else if(a==='next')step(1);
    else if(a==='prev')step(-1);
  })}catch(x){}
}
function blobB64(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]||'');f.onerror=()=>r('');f.readAsDataURL(b)})}
async function coverB64(t){
  if(t.b64U===t.pic)return t.b64||'';
  t.b64U=t.pic;t.b64='';
  const b=t.pic?blobOf.get(t.pic):null;
  if(b&&b.size<300000)t.b64=await blobB64(b);
  return t.b64;
}
async function bgSend(playing){
  const b=bgPlugin(),t=tracks[cur];if(!b||!t)return;
  bgListen(b);
  const cover=await coverB64(t);
  try{b.start({title:t.title,text:t.artist||'Coverly',playing,cover}).catch(()=>{})}catch(e){}
}
function bgStart(){bgSend(true)}
function bgStop(){bgSend(false)}

function detectLang(){
  let l=null;try{l=localStorage.getItem('cfp_lang')}catch(e){}
  if(l&&I18N[l])return l;
  const n=(navigator.language||'en').toLowerCase().slice(0,2);
  return I18N[n]?n:'en';
}
let lang=detectLang();
function T(k,v){
  let s=(I18N[lang]&&I18N[lang][k])||I18N.en[k]||k;
  if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);
  return s;
}
function setLang(v){lang=v;try{localStorage.setItem('cfp_lang',v)}catch(e){}applyLang()}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll('[data-ia]').forEach(e=>{const s=T(e.dataset.ia);e.setAttribute('aria-label',s);e.title=s});

  refreshSettings();updateRail();

}

let sel=null,delArmT=false;
const queue=[];
let toastT=0;
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200)}
const selRows=()=>[...tlist.children];
const favActive=()=>!!(playlists[pi]&&playlists[pi].fav);
function updateSelBar(){
  $('selN').textContent=T('sel_n',{n:sel?sel.size:0});
  const l=favActive()?T('rm_fav'):T('del');$('sDel').setAttribute('aria-label',l);$('sDel').title=l;
}
function enterSel(t){
  if(view!=='tl')return;
  sel=new Set([t]);delArmT=false;$('sDel').classList.remove('arm');
  tl.classList.add('selmode');
  selRows().forEach(r=>r.classList.toggle('picked',r._t===t));
  updateSelBar();
}
function toggleSel(t,r){
  if(!sel)return;
  if(sel.has(t))sel.delete(t);else sel.add(t);
  r.classList.toggle('picked',sel.has(t));
  if(!sel.size)exitSel();else updateSelBar();
}
function exitSel(){sel=null;delArmT=false;tl.classList.remove('selmode');$('sDel').classList.remove('arm');selRows().forEach(r=>r.classList.remove('picked'))}
const pickedTracks=()=>selRows().map(r=>r._t).filter(t=>sel&&sel.has(t));
$('sX').onclick=exitSel;
$('sAll').onclick=()=>{if(!sel)return;sel=new Set(selRows().filter(r=>r.style.display!=='none').map(r=>r._t));selRows().forEach(r=>r.classList.toggle('picked',sel.has(r._t)));updateSelBar()};
$('sQ').onclick=()=>{if(!sel)return;const ts=pickedTracks();queue.push(...ts);toast(T('t_q',{n:ts.length}));exitSel()};

function removeFromCurrent(ts){
  const curT=tracks[cur],removedCur=ts.has(curT);
  tracks.splice(0,tracks.length,...tracks.filter(t=>!ts.has(t)));
  for(let i=queue.length-1;i>=0;i--)if(ts.has(queue[i]))queue.splice(i,1);
  ts.forEach(t=>{if(t.el){t.el.remove();t.vis=false}shown.delete(t)});
  if(removedCur){
    pend=null;clearTimeout(selT);audio.pause();
    cur=Math.min(cur,Math.max(0,tracks.length-1));
    if(tracks.length)select(cur,false);
    else{audio.removeAttribute('src');$('t').textContent='';$('a').textContent='';$('empty').classList.remove('hide');setTheme(null)}
  }else cur=Math.max(0,tracks.indexOf(curT));
  layout();updateRail();scheduleSave();
  if(view==='tl')renderList();
}
function deleteTracks(ts){
  removeFromCurrent(ts);
  const gone=[];
  ts.forEach(t=>{
    if(playlists.some(p=>!p.fav&&p.tracks.includes(t)))return;
    gone.push(t.id);t.fav=false;
    const fv=playlists.find(p=>p.fav);if(fv){const i=fv.tracks.indexOf(t);if(i>=0)fv.tracks.splice(i,1)}
    try{URL.revokeObjectURL(t.url)}catch(e){}
  });
  if(gone.length){delTracks(gone);updateRail();scheduleSave()}
}
$('sDel').onclick=()=>{
  if(!sel||!sel.size)return;
  const fav=favActive();
  if(!fav&&!delArmT){delArmT=true;$('sDel').classList.add('arm');toast(T('del_again'));return}
  const ts=new Set(pickedTracks());exitSel();
  if(fav){ts.forEach(t=>{t.fav=false;saveMeta(t)});removeFromCurrent(ts)}
  else deleteTracks(ts);
  toast(T('t_rm',{n:ts.size}));
};

function renderMove(){

  $('mvm').style.display=fav?'none':'';
  $('mvl').textContent='';

$('sMv').onclick=()=>{if(!sel||!sel.size)return;mvTs=pickedTracks();if(favActive())mvMode='copy';renderMove();$('mvd').classList.add('show')};
$('mvc').onclick=()=>$('mvd').classList.remove('show');
$('mvd').onclick=e=>{if(e.target===$('mvd'))$('mvd').classList.remove('show')};
function finishMove(p){
  const ts=mvTs,move=mvMode==='move'&&!favActive();
  $('mvd').classList.remove('show');
  ts.forEach(t=>{if(!p.tracks.includes(t))p.tracks.push(t)});

  updateRail();scheduleSave();
  toast(T(move?'t_mv':'t_cp',{n:ts.length}));
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crcAdd(crc,u){for(let i=0;i<u.length;i++)crc=CRC_T[(crc^u[i])&255]^(crc>>>8);return crc}
async function crcOfBlob(b){let crc=0xFFFFFFFF;for(let o=0;o<b.size;o+=4194304)crc=crcAdd(crc,new Uint8Array(await b.slice(o,o+4194304).arrayBuffer()));return(crc^0xFFFFFFFF)>>>0}
async function buildZip(entries,onProgress){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0,i=0;
  const now=new Date(),dt=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF,tm=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  if(entries.length>60000)throw new Error('big');
  for(const e of entries){
    const nameB=enc.encode(e.name),blob=e.data instanceof Blob?e.data:new Blob([e.data]),size=blob.size,crc=await crcOfBlob(blob);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nameB,blob);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,nameB.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,nameB);
    off+=30+nameB.length+size;
    if(off>3.9e9)throw new Error('big');
    if(onProgress)onProgress(++i,entries.length);
  }
  const cdSize=cd.reduce((a,b)=>a+b.byteLength,0),eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,entries.length,true);eo.setUint16(10,entries.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  return new Blob([...parts,...cd,eo.buffer],{type:'application/zip'});
}
async function readZip(file){
  const size=file.size,tail=new Uint8Array(await file.slice(Math.max(0,size-65557),size).arrayBuffer());
  let p=tail.length-22;while(p>=0&&!(tail[p]===0x50&&tail[p+1]===0x4b&&tail[p+2]===5&&tail[p+3]===6))p--;
  if(p<0)throw new Error('format');
  const dv=new DataView(tail.buffer,tail.byteOffset,tail.byteLength);
  const n=dv.getUint16(p+10,true),cdSize=dv.getUint32(p+12,true),cdOff=dv.getUint32(p+16,true);
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()),dec=new TextDecoder(),map=new Map();let q=0;
  for(let i=0;i<n;i++){
    if(cd.getUint32(q,true)!==0x02014b50)throw new Error('format');
    const method=cd.getUint16(q+10,true),csize=cd.getUint32(q+20,true),nl=cd.getUint16(q+28,true),el=cd.getUint16(q+30,true),cl=cd.getUint16(q+32,true),lho=cd.getUint32(q+42,true);
    if(method!==0)throw new Error('format');
    map.set(dec.decode(new Uint8Array(cd.buffer,q+46,nl)),{lho,csize});
    q+=46+nl+el+cl;
  }
  return{async get(name){
    const e=map.get(name);if(!e)return null;
    const lh=new DataView(await file.slice(e.lho,e.lho+30).arrayBuffer()),o=e.lho+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    return file.slice(o,o+e.csize);
  }};
}

// --- сохранение файла: на Android через плагин, иначе обычное скачивание ---
function filesPlugin(){try{return NATIVE&&Capacitor.Plugins&&Capacitor.Plugins.CoverlyFiles}catch(e){return null}}
async function deliver(blob,name){
  const P=filesPlugin();
  if(P){
    await P.saveBegin({name,mime:'application/zip'});
    for(let o=0;o<blob.size;o+=1048576){await P.saveChunk({data:await blobB64(blob.slice(o,o+1048576))})}
    const r=await P.saveEnd();return r&&r.path;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),120000);
  return '';
}
async function exportBackup(full){
  if(bkBusy)return;bkBusy=true;
  try{
    const all=new Map();playlists.forEach(p=>p.tracks.forEach(t=>all.set(t.id,t)));
    const entries=[],trs=[];
    for(const t of all.values()){
      const e={id:t.id,title:t.title,artist:t.artist,base:t.base,fav:!!t.fav,size:t.file?t.file.size:(t.size||0),name:t.file?t.file.name:(t.fname||t.base)};
      const pb=t.pic&&blobOf.get(t.pic);
      if(pb){e.cover='covers/'+t.id+'.jpg';entries.push({name:e.cover,data:pb})}else if(t.pic&&/^https?:/.test(t.pic))e.picUrl=t.pic;
      if(t.lrcFile){e.lrc='lyrics/'+t.id+'.lrc';entries.push({name:e.lrc,data:t.lrcFile})}else if(t.lrcText)e.lrcText=t.lrcText;
      if(full&&t.file){e.audio='audio/'+t.id+'_'+safeName(t.file.name);entries.push({name:e.audio,data:t.file})}
      trs.push(e);
    }
    const pls=playlists.map((p,k)=>{
      const o={name:p.name,fav:!!p.fav,ids:p.tracks.map(t=>t.id),cur:p.cur||0},pb=p.pic&&blobOf.get(p.pic);
      if(pb){o.cover='plcovers/'+k+'.jpg';entries.push({name:o.cover,data:pb})}
      return o;
    });
    const manifest={format:1,app:'Coverly',created:new Date().toISOString(),full:!!full,tracks:trs,playlists:pls,
      settings:{lang,theme:themeMode,accent,online:onlineOn,shuf,rep,fade:fadeOn,eq:eqName,vol:+$('vol').value}};
    entries.unshift({name:'coverly-backup.json',data:new Blob([JSON.stringify(manifest)],{type:'application/json'})});
    const zip=await buildZip(entries,(n,m)=>{if(n%5===0||n===m)working(T('bk_export_n',{n,m}))});
    const stamp=new Date().toISOString().slice(0,10);
    const path=await deliver(zip,'Coverly-backup-'+stamp+(full?'':'-playlists')+'.zip');
    toast(T('bk_saved')+(path?': '+path:''));
  }catch(e){toast(String(e&&e.message)==='big'?T('bk_big'):T('bk_err'))}
  finally{bkBusy=false}
}
function applySettings(st){
  try{
    if(st.lang&&I18N[st.lang])setLang(st.lang);
    if(st.theme){themeMode=st.theme;try{localStorage.setItem('cfp_theme',st.theme)}catch(e){}applyMode()}
    if(st.accent){accent=st.accent;try{localStorage.setItem('cfp_accent',st.accent)}catch(e){}retheme()}
    if(typeof st.online==='boolean'){onlineOn=st.online;try{localStorage.setItem('cfp_online',st.online?'1':'0')}catch(e){}}
    shuf=!!st.shuf;rep=st.rep||0;audio.loop=rep===2;fadeOn=!!st.fade;eqName=st.eq||'off';
    if(st.vol!=null)setVol(st.vol);
    syncModeBtns();refreshSettings();
  }catch(e){}
}
async function importBackup(file){
  if(bkBusy)return;bkBusy=true;
  try{
    const z=await readZip(file),mb=await z.get('coverly-backup.json');
    if(!mb)throw new Error('format');
    const m=JSON.parse(await mb.text());
    if(m.app!=='Coverly'||!Array.isArray(m.tracks)||!Array.isArray(m.playlists))throw new Error('format');
    const have=new Map();playlists.forEach(p=>p.tracks.forEach(t=>have.set(t.id,t)));
    const fresh=playlists.length===0,made=new Map();let n=0;
    for(const e of m.tracks){
      if(have.has(e.id)){made.set(e.id,have.get(e.id));continue}
      const t={id:e.id,title:e.title,artist:e.artist,base:e.base,fav:!!e.fav,size:e.size||0,fname:e.name||''};
      if(e.audio){const b=await z.get(e.audio);if(b){t.file=new File([b],e.name||'track',{type:mimeOf(e.name||'')});t.url=URL.createObjectURL(t.file)}}
      if(!t.file)t.missing=true;
      if(e.cover){const b=await z.get(e.cover);if(b)t.pic=URL.createObjectURL(b)}else if(e.picUrl)t.pic=e.picUrl;
      if(e.lrc){const b=await z.get(e.lrc);if(b)t.lrcFile=new File([b],(e.base||'lyrics')+'.lrc')}else if(e.lrcText)t.lrcText=e.lrcText;
      made.set(e.id,t);
      if(t.file)putTrack(t);else saveMeta(t);
      if(++n%3===0)working(T('bk_import_n',{n,m:m.tracks.length}));
    }
    let added=0;
    for(const p of m.playlists){
      if(p.fav){const f=ensureFav();p.ids.forEach(id=>{const t=made.get(id);if(t){t.fav=true;if(!f.tracks.includes(t))f.tracks.push(t);saveMeta(t)}});continue}
      const pl={name:p.name,tracks:p.ids.map(id=>made.get(id)).filter(Boolean),cur:p.cur||0,pic:null};
      if(p.cover){const b=await z.get(p.cover);if(b)pl.pic=URL.createObjectURL(b)}
      playlists.push(pl);added++;
    }
    if(fresh&&m.settings)applySettings(m.settings);
    if(pi<0&&playlists.length)switchPl(Math.max(0,playlists.findIndex(p=>!p.fav)));
    else if(pi>=0&&view==='tl')renderList();
    updateRail();scheduleSave();
    toast(T('bk_imported',{n:added}));
  }catch(e){toast(T('bk_err'))}
  finally{bkBusy=false}
}
$('bkfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importBackup(f)};

const setRail=o=>{$('rail').classList.toggle('open',o);$('veil').classList.toggle('show',o)};
$('menu').onclick=()=>setRail(!$('rail').classList.contains('open'));
$('veil').onclick=()=>setRail(false);
$('addBtn').onclick=()=>$('file').click();
$('plfile').onchange=e=>{const fs=e.target.files;if(fs.length){createPl();addFiles(fs)}e.target.value=''};
updateRail();
let artTarget=null;
$('imgfile').onchange=e=>{const f=e.target.files[0],t=artTarget||tracks[cur];if(f&&t){t.pic=URL.createObjectURL(f);setCover(t);saveMeta(t);if(t===tracks[cur])applyTrackUI(t);if(t===tracks[cur]&&'mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:[{src:t.pic}]})}e.target.value='';artTarget=null};
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('pp').onclick=toggle;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
const ICO=p=>`<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="${p}"/></svg>`;
const PLAY=ICO('M8 5v14l11-7z'),PAUSE=ICO('M7 5h4v14H7zM13 5h4v14h-4z');
audio.onplay=()=>{$('pp').innerHTML=PAUSE;initAudio();if(actx&&actx.state==='suspended')actx.resume();bgStart();ensureLoop()};
audio.onpause=()=>{$('pp').innerHTML=PLAY;bgStop()};
audio.onended=()=>{
  if(sleepEnd){sleepEnd=false;sleepSel=0;refreshSettings();return}
  if(queue.length){step(1);return}
  if(shuf&&tracks.length>1)step(1);
  else if(cur<tracks.length-1)select(cur+1,true);
  else rep===1?select(0,true):select(0,false)
};
const fill=el=>el.style.setProperty('--p',el.value/el.max*100+'%');
audio.ontimeupdate=()=>{if(!seeking&&audio.duration){$('seek').value=audio.currentTime/audio.duration*1000;fill($('seek'))}$('cur').textContent=fmt(audio.currentTime)};
audio.onloadedmetadata=()=>$('dur').textContent=fmt(audio.duration);
$('seek').oninput=e=>{seeking=true;fill(e.target);if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration};
$('seek').onchange=()=>seeking=false;
const VI=l=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9z"/>${l===0?'<path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>':'<path d="M15 9.5a4 4 0 010 5'+(l===2?'M17.5 7a8 8 0 010 10':'')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>'}</svg>`;
let lastVol=100;
function setVol(v){v=Math.max(0,Math.min(100,v));userVol=v/100;applyVol(curMult);const r=$('vol');r.value=v;fill(r);$('mute').innerHTML=VI(v===0?0:v<50?1:2);scheduleSave()}
$('vol').oninput=e=>{const v=+e.target.value;setVol(v);if(v)lastVol=v};
$('mute').onclick=()=>{if(userVol>0){lastVol=Math.round(userVol*100)||lastVol;setVol(0)}else setVol(lastVol||100)};
setVol(100);
audio.volume=.5;if(audio.volume!==.5){$('mute').style.display=$('vol').style.display='none'}audio.volume=1;

// управление: клавиши, колесо, свайп
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')select(cur+1,!audio.paused);
  else if(e.key==='ArrowLeft')select(cur-1,!audio.paused);
  else if(e.key===' '){e.preventDefault();toggle()}
});
let wl=0;
stage.addEventListener('wheel',e=>{e.preventDefault();const n=Date.now();if(n-wl<120)return;wl=n;select(cur+(e.deltaX+e.deltaY>0?1:-1),!audio.paused)},{passive:false});
let sx=null,acc=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;acc=0});
addEventListener('pointermove',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx;
  if(Math.abs(dx)>50){select(cur+(dx<0?1:-1),!audio.paused);sx=e.clientX}
});
addEventListener('pointerup',()=>sx=null);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
  navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));
  navigator.mediaSession.setActionHandler('play',()=>toggle());
  navigator.mediaSession.setActionHandler('pause',()=>toggle());
}
applyMode();
applyLang();
restore().finally(()=>{ready=true;scheduleSave()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
adsInit();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!NATIVE){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
